<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Supabase Blog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        a { text-decoration: none; color: #007bff; }
        .btn { display: inline-block; padding: 8px 12px; background: #007bff; color: white; border-radius: 4px; margin-bottom: 20px; }
        .btn-danger { background: #dc3545; }
        .btn-edit { background: #ffc107; color: #000; }
        .post { border-bottom: 1px solid #ccc; padding: 15px 0; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input[type="text"], textarea { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
