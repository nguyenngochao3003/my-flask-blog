<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực Hệ thống & Phân quyền</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-full max-w-md p-8 transition-all">
    
    <!-- HEADER -->
    <div class="text-center mb-8">
      <h1 id="form-title" class="text-2xl font-bold text-slate-800">Đăng Nhập Hệ Thống</h1>
      <p id="form-subtitle" class="text-slate-500 text-sm mt-1">Vui lòng nhập thông tin để truy cập</p>
    </div>

    <!-- THÔNG BÁO LỖI / THÀNH CÔNG -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center"></div>

    <!-- FORM ĐĂNG NHẬP / ĐĂNG KÝ -->
    <form id="auth-form" class="space-y-4" onsubmit="handleSubmit(event)">
      
      <!-- USERNAME (Chỉ hiện khi Đăng ký) -->
      <div id="username-field" class="hidden">
        <label class="block text-sm font-medium text-slate-700 mb-1">Tên người dùng (Username)</label>
        <input type="text" id="username" placeholder="nguyenvana" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- EMAIL -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Địa chỉ Email</label>
        <input type="email" id="email" required placeholder="user@example.com" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- PASSWORD -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
        <input type="password" id="password" required placeholder="••••••••" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- NÚT SUBMIT -->
      <button type="submit" id="btn-submit" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
        Đăng Nhập
      </button>
    </form>

    <!-- FOOTER CHUYỂN ĐỔI FORM -->
    <div class="mt-6 text-center text-sm text-slate-600">
      <span id="toggle-text">Chưa có tài khoản?</span>
      <button type="button" onclick="toggleMode()" id="toggle-btn" class="text-blue-600 font-semibold hover:underline ml-1">
        Đăng ký ngay
      </button>
    </div>

  </div>

  <script>
    let isSignUp = false;

    function toggleMode() {
      isSignUp = !isSignUp;
      const usernameField = document.getElementById('username-field');
      const formTitle = document.getElementById('form-title');
      const formSubtitle = document.getElementById('form-subtitle');
      const btnSubmit = document.getElementById('btn-submit');
      const toggleText = document.getElementById('toggle-text');
      const toggleBtn = document.getElementById('toggle-btn');
      
      hideAlert();

      if (isSignUp) {
        usernameField.classList.remove('hidden');
        document.getElementById('username').required = true;
        formTitle.innerText = "Tạo Tài Khoản Mới";
        formSubtitle.innerText = "Điền thông tin để được cấp quyền hệ thống";
        btnSubmit.innerText = "Tạo Tài Khoản";
        toggleText.innerText = "Đã có tài khoản?";
        toggleBtn.innerText = "Đăng nhập";
      } else {
        usernameField.classList.add('hidden');
        document.getElementById('username').required = false;
        formTitle.innerText = "Đăng Nhập Hệ Thống";
        formSubtitle.innerText = "Vui lòng nhập thông tin để truy cập";
        btnSubmit.innerText = "Đăng Nhập";
        toggleText.innerText = "Chưa có tài khoản?";
        toggleBtn.innerText = "Đăng ký ngay";
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value;
      const btnSubmit = document.getElementById('btn-submit');

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Đang xử lý...";

      // Chọn endpoint dựa theo chế độ Đăng nhập hay Đăng ký
      const endpoint = isSignUp ? '/api/signup' : '/api/login';
      const payload = isSignUp ? { email, password, username } : { email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Có lỗi xảy ra, vui lòng thử lại!");
        }

        if (isSignUp) {
          showAlert(result.message, "success");
          setTimeout(() => toggleMode(), 2000);
        } else {
          showAlert("Đăng nhập thành công! Đang chuyển hướng...", "success");
          setTimeout(() => {
            window.location.href = result.redirect_url || "/product";
          }, 1000);
        }

      } catch (err) {
        showAlert(err.message, "error");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = isSignUp ? "Tạo Tài Khoản" : "Đăng Nhập";
      }
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById('alert-box');
      alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-100', 'text-red-700');
      } else {
        alertBox.classList.add('bg-green-100', 'text-green-700');
      }
      alertBox.innerText = message;
    }

    function hideAlert() {
      document.getElementById('alert-box').classList.add('hidden');
    }
  </script>
</body>
</html>
