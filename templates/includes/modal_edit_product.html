
<div class="modal-overlay" id="modal-edit-product">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Thông tin sản phẩm</h3>
        <button class="modal-close" onclick="closeModal('modal-edit-product')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        
        <div class="form-group">
          <label>Tên SP</label>
          <input id='editProductForm_name' type="text" class="form-control" placeholder="Nhập tên sản phẩm...">
        </div>

        <div class="form-group">
          <label>Mã Code</label>
          <input type="text" class="form-control" id="editProductForm_code" placeholder="Nhập mã code sản phẩm...">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nhà cung cấp</label>
            <div class="input-with-action">
              <select class="form-control" id='supplierSelectEdit'>
              
              </select>
              <button class="btn btn-secondary" title="Tạo nhà cung cấp mới" onclick="openModal('modal-supplier')">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Nhóm</label>
            <div class="input-with-action">
              <select class="form-control" id='categorySelectEdit'>
              </select>
              <button class="btn btn-secondary" title="Tạo nhóm mới" onclick="openModal('modal-category')">+</button>
            </div>
          </div>
        </div>



        <div class="form-group">
          <label>Tính năng chụp / quét</label>
          <div class="media-buttons">
            <button class="btn btn-secondary" onclick="openQRScanner()"><i class="fa-solid fa-qrcode"></i> Quét mã QR</button>
            <button class="btn btn-secondary"><i class="fa-solid fa-camera"></i> Chụp ảnh sản phẩm</button>
          </div>
        </div>

        <div class="form-group">
          <label>Hình ảnh sản phẩm</label>
          <input id='editProductForm_image' type="file" class="form-control" accept="image/*">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-edit-product')">Hủy</button>
        <button class="btn btn-primary" id='btnAddProduct' onclick='submit_editProduct()'>Lưu</button>
      </div>
    </div>
    <!-- 2. NƠI GỌI CÁC FILE FORM MODAL VÀO -->
  {% include 'includes/modal_add_supplier.html' %}
  {% include 'includes/modal_add_category.html' %}
    
  </div>
