
<div class="modal-overlay" id="modal-add-product">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id='form_add_product'>Thêm Sản phẩm Mới</h3>
        <button class="modal-close" onclick="closeModal('modal-add-product')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        
        <div class="form-group">
          <label>Tên SP</label>
          <input id='productForm_name' type="text" class="form-control" placeholder="Nhập tên sản phẩm...">
        </div>

        <div class="form-group">
          <label>Mã Code sản phẩm</label>
          <div class="input-with-action">
            <input type="text" class="form-control" id="productForm_code" placeholder="Nhập mã code sản phẩm...">
            <button class="btn btn-secondary" onclick="openQRScanner('productForm_code')"><i class="fa-solid fa-qrcode"></i></button> 
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nhà cung cấp</label>
            <div class="input-with-action">
              <select class="form-control" id='supplierSelect'>
              
              </select>
              <button class="btn btn-secondary" title="Tạo nhà cung cấp mới" onclick="openModal('modal-supplier')">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Nhóm</label>
            <div class="input-with-action">
              <select class="form-control" id='categorySelect'>
              </select>
              <button class="btn btn-secondary" title="Tạo nhóm mới" onclick="openModal('modal-category')">+</button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Ngày tạo</label>
            <input type="date" class="form-control" value="2023-10-25">
          </div>
        </div>

        <div class="form-group">
          <label>URL ảnh sản phẩm</label>
          <div class="input-with-action">
            <input disabled type="text" class="form-control" id="productForm_urlPicture" placeholder="url hình ảnh sản phẩm...">
            <button class="btn btn-secondary" onclick="window.takePicture('productForm_picture', 'productForm_urlPicture')">
              <i class="fa-solid fa-camera"></i>
            </button>
          </div>
        </div>
        <img id="productForm_picture" src="" alt="" width="200" height="200" style="display: none;">

        <div class="form-group">
          <label>Hình ảnh sản phẩm</label>
          <input type="file" class="form-control" accept="image/*">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-add-product')">Hủy</button>
        <button class="btn btn-primary" id='btnAddProduct' onclick='submit_addProduct()'>Lưu</button>
      </div>
    </div>
    <!-- 2. NƠI GỌI CÁC FILE FORM MODAL VÀO -->
  {% include 'includes/modal_add_supplier.html' %}
  {% include 'includes/modal_add_category.html' %}
  
    
</div>
