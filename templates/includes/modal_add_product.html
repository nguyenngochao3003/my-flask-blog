


<div class="modal-overlay" id="modal-add-product">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Thêm Sản phẩm Mới</h3>
        <button class="modal-close" onclick="closeModal('modal-add-product')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        
        <div class="form-group">
          <label>Tên SP</label>
          <input type="text" class="form-control" placeholder="Nhập tên sản phẩm..." id="productForm_name">
        </div>

        <div class="form-group">
          <label>Mã Code</label>
          <input type="text" class="form-control" id="productForm_code" placeholder="Nhập mã code sản phẩm...">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nhà cung cấp</label>
            <div class="input-with-action">
              <select class="form-control" id="productForm_supplier">
                {%for item in suplier_data%}
                  <option value="{{item.name}}">{{item.name}}</option>
                {% else %}
                  <option value="không có nhà cung cấp">không có nhà cung cấp </option>
                {% endfor %} 
              </select>
              <button class="btn btn-secondary" title="Tạo nhà cung cấp mới" onclick="openModal('modal-supplier')">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>Nhóm</label>
            <div class="input-with-action">
              <select class="form-control" id="productForm_group">
                {%for item in prod_group_data%}
                  <option value="{{item.name}}">{{item.name}}</option>
                {% else %}
                  <option value="không có dữ liệu">không có dữ liệu</option>
                {% endfor %}
              </select>
              <button class="btn btn-secondary" title="Tạo nhóm mới" onclick="openModal('modal-category')">+</button>
            </div>
          </div>
        </div>

        <!-- <div class="form-row">
          <div class="form-group">
            <label>Ngày tạo</label>
            <input type="date" class="form-control" value="2023-10-25">
          </div>
        </div> -->

        <div class="form-group">
          <label>Tính năng chụp / quét</label>
          <div class="media-buttons">
            <button class="btn btn-secondary" onclick="openQRScanner()"><i class="fa-solid fa-qrcode"></i> Quét mã QR</button>
            <button class="btn btn-secondary"><i class="fa-solid fa-camera"></i> Chụp ảnh sản phẩm</button>
          </div>
        </div>

        <div class="form-group">
          <label>Hình ảnh sản phẩm</label>
          <input type="file" class="form-control" accept="image/*">
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-add-product')">Hủy</button>
        <button class="btn btn-primary" id="btn-submit" onclick="submit_form(event)">Lưu</button>
      </div>
    </div>
    <!-- 2. NƠI GỌI CÁC FILE FORM MODAL VÀO -->
  {% include 'includes/modal_add_supplier.html' %}
  {% include 'includes/modal_add_category.html' %}
    
  </div>
  
  <script>
     async function submit_form(event) {
      event.preventDefault();

      // 1. lấy dữ liệu
      const name = document.getElementById('productForm_name').value;
      const code = document.getElementById('productForm_code').value;
      const group = document.getElementById('productForm_group').value;
      const supplier = document.getElementById('productForm_supplier').value;
      const btnSubmit = document.getElementById('btn-submit');

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Đang xử lý...";

      // Chọn endpoint dựa theo chế độ Đăng nhập hay Đăng ký
      const endpoint = '/api/add_product';
      const payload = { name, code, group, supplier };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Có lỗi xảy ra, vui lòng thử lại!");
        }
        // Xử lý khi thành công: Load lại trang /product để cập nhật danh sách
        window.location.href = '/product';

      } catch (err) {
        console.error("Error:", err);
      } finally {
        btnSubmit.disabled = false;
        document.getElementById('modal-add-product').classList.remove('active');
      }
    }
  </script>
